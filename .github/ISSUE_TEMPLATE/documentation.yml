name: Documentation improvement
description: Improve setup, integration, troubleshooting, or evidence semantics
title: "[Docs]: "
labels:
  - documentation
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the README, docs, and existing issues.
          required: true
        - label: Any example values are synthetic and contain no secrets or personal call data.
          required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: File, heading, command, or URL that needs improvement.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Documentation problem
      description: What was unclear, missing, or incorrect?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Suggested improvement
  - type: textarea
    id: validation
    attributes:
      label: How to validate it
      description: Commands or reader workflow that should succeed after the change.
