name: Bug report
description: Report a reproducible VoxBench defect with privacy-safe evidence
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please use synthetic or redacted evidence. Do not attach secrets, raw SIP/SDP, packet payloads, caller identifiers, or private recordings.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and personal call data from this report.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and why is it a problem?
      placeholder: A completed real-call run is shown as a synthetic demo run...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest sequence that reproduces the problem.
      placeholder: |
        1. Start ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
      description: Separate the expected contract from the observed result.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include safe aliases only.
      placeholder: |
        VoxBench commit:
        Python:
        OS:
        Browser:
        Provider/model alias:
        Telephony engine:
        Codec/sample rate:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence coverage
      description: Which layers were connected, and which remained unobserved?
      placeholder: |
        Stage recordings:
        Provider lifecycle:
        RTP/RTCP:
        Caller-side playout:
        Relevant safe incident/metric summary:
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add redacted screenshots or synthetic fixtures only.
